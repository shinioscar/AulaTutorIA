<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8">
    <title>AulaTutor IA</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Apply the explicit visual preference before styles and Angular render.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('aulatutor.theme.v1') === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body><app-root></app-root></body>
</html>
