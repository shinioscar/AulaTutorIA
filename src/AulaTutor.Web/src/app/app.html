<a class="skip-link" href="#content">Saltar al contenido</a>
<header>
  <a class="brand" routerLink="/">AulaTutor IA</a>
  <nav aria-label="Navegación principal">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Inicio</a>
    @if (auth.user(); as user) {
      @if (user.roles.length) { <a routerLink="/groups" routerLinkActive="active">Grupos</a> }
      @if (auth.hasRole('Admin')) { <a routerLink="/admin/users" routerLinkActive="active">Administración</a> }
      <button type="button" class="secondary" (click)="logout()">Cerrar sesión</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Entrar</a><a routerLink="/register" routerLinkActive="active">Registro</a>
    }
  </nav>
</header>
<main id="content" tabindex="-1">
  <p role="status" class="message">{{ message() }}</p>
  <router-outlet />
</main>
<footer>Aprendizaje con supervisión docente · Piloto con datos ficticios</footer>
