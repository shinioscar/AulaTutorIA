name: aulatutor-ia
services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aulatutor}
      POSTGRES_USER: ${POSTGRES_USER:-aulatutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Ai__Provider: ${AI_PROVIDER:-Mock}
      ConnectionStrings__AulaTutor: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aulatutor};Username=${POSTGRES_USER:-aulatutor};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
