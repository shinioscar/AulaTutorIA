name: aulatutor-ia
services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aulatutor}
      POSTGRES_USER: ${POSTGRES_USER:-aulatutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /https/localhost.pem
      Kestrel__Certificates__Default__KeyPath: /https/localhost.key
      DataProtection__KeyPath: /keys
      Ai__Provider: ${AI_PROVIDER:-Mock}
      Ai__Groq__ApiKey: ${GROQ_API_KEY:-}
      Ai__Groq__Model: ${GROQ_MODEL:-}
      Ai__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Ai__Gemini__Model: ${GEMINI_MODEL:-}
      Ai__Ollama__Model: ${OLLAMA_MODEL:-}
      Ai__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      Ai__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-30}
      Ai__MaxConcurrency: ${AI_MAX_CONCURRENCY:-2}
      Ai__MaxRetries: ${AI_MAX_RETRIES:-0}
      Ai__MaxRetryDelaySeconds: ${AI_MAX_RETRY_DELAY_SECONDS:-5}
      ConnectionStrings__AulaTutor: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aulatutor};Username=${POSTGRES_USER:-aulatutor};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
      - "127.0.0.1:${API_HTTPS_PORT:-7080}:8443"
    volumes:
      - ../.cache/certs:/https:ro
      - data_protection:/keys
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  data_protection:
